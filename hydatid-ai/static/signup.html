<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · CystStage AI</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/vendor/supabase.js"></script>
</head>
<body data-page="signup">
  <section class="auth">
    <div class="auth-visual">
      <div class="auth-tag"><h1>Create your <em>account.</em></h1><p>Doctors assess scans and confirm stages. Patients read their own reports.</p></div>
    </div>
    <div class="auth-panel">
      <div class="card auth-card">
        <div class="brand" style="margin-bottom:18px"><div class="logo"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="16" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="3 2.4"/><circle cx="16" cy="16" r="2" fill="currentColor"/></svg></div><div><div class="brand-name">CystStage <span>AI</span></div><div class="brand-sub">Create an account</div></div></div>
        <div class="seg">
          <a class="seg-btn" href="/login">Sign in</a>
          <a class="seg-btn active" href="/signup">Create account</a>
        </div>
        <form id="auth-form" autocomplete="on">
          <div class="small muted" style="font-weight:600;margin-bottom:6px">I am a</div>
          <div class="role-pick" id="role-pick">
            <button type="button" class="role on" data-r="doctor"><span>🩺</span><b>Doctor</b><small>Assess scans, confirm stages</small></button>
            <button type="button" class="role" data-r="patient"><span>🧑</span><b>Patient</b><small>View my reports</small></button>
          </div>
          <label class="field"><span>Full name</span><input id="a-name" autocomplete="name" required placeholder="Dr. Zaheer Ahmed" /></label>
          <label class="field" id="code-row"><span>Doctor access code</span><input id="a-code" placeholder="Given by your hospital admin" /></label>
          <label class="field"><span>Email</span><input id="a-email" type="email" autocomplete="email" required placeholder="you@hospital.org" /></label>
          <label class="field"><span>Password</span><input id="a-pass" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters" /></label>
          <div id="auth-msg" class="small" role="status" aria-live="polite"></div>
          <button class="btn btn-primary btn-lg" id="auth-go" type="submit" style="width:100%;justify-content:center">Create account</button>
        </form>
        <p class="small muted" style="margin:14px 0 0;text-align:center">Already have an account? <a href="/login">Sign in</a></p>
      </div>
    </div>
  </section>
  <script type="module" src="/static/auth_page.js"></script>
</body>
</html>
