<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CystStage AI · sign in</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/vendor/supabase.js"></script>
</head>
<body data-portal="doctor" class="portal">
  <section class="auth portal-auth">
    <div class="auth-visual">
      <div class="auth-tag">
        <span class="eyebrow" id="p-eyebrow">Clinician workspace</span>
        <h1 id="p-h1">Stage hydatid cysts with <em>evidence you can check.</em></h1>
        <p id="p-lede">Triage your patients, run the WHO-IWGE staging with the reasons shown, and send patients a clear report.</p>
      </div>
    </div>
    <div class="auth-panel">
      <div class="card auth-card">
        <div class="brand" style="margin-bottom:18px"><div class="logo"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="16" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="3 2.4"/><circle cx="16" cy="16" r="2" fill="currentColor"/></svg></div><div><div class="brand-name">CystStage <span>AI</span></div><div class="brand-sub" id="p-sub">Doctor sign-in</div></div></div>
        <div class="seg" role="tablist">
          <button type="button" class="seg-btn active" data-mode="in" role="tab">Sign in</button>
          <button type="button" class="seg-btn" data-mode="up" role="tab">Create account</button>
        </div>
        <form id="auth-form" autocomplete="on">
          <div id="up-only" hidden>
            <label class="field"><span>Full name</span><input id="a-name" autocomplete="name" placeholder="Dr. Zaheer Ahmed" /></label>
            <label class="field" id="code-row"><span>Doctor access code</span><input id="a-code" placeholder="Given by your hospital admin" /></label>
          </div>
          <label class="field"><span>Email</span><input id="a-email" type="email" autocomplete="email" required placeholder="you@hospital.org" /></label>
          <label class="field"><span>Password</span><input id="a-pass" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters" /></label>
          <div id="auth-msg" class="small" role="status" aria-live="polite"></div>
          <button class="btn btn-primary btn-lg" id="auth-go" type="submit" style="width:100%;justify-content:center">Sign in</button>
        </form>
        <p class="small muted" id="p-switch" style="margin:14px 0 0;text-align:center"></p>
        <p class="small muted" style="margin:10px 0 0;text-align:center"><a href="/">← Back to start</a></p>
      </div>
    </div>
  </section>
  <script type="module" src="/static/portal.js"></script>
</body>
</html>
