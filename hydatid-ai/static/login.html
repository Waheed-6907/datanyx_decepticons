<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · CystStage AI</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/vendor/supabase.js"></script>
</head>
<body data-page="login">
  <section class="auth">
    <div class="auth-visual">
      <div class="auth-tag"><h1>The AI that knows <em>what it doesn't know.</em></h1><p>Evidence-based hydatid cyst staging for doctors, and clear reports for patients.</p></div>
    </div>
    <div class="auth-panel">
      <div class="card auth-card">
        <div class="brand" style="margin-bottom:18px"><div class="logo"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="16" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="3 2.4"/><circle cx="16" cy="16" r="2" fill="currentColor"/></svg></div><div><div class="brand-name">CystStage <span>AI</span></div><div class="brand-sub">Sign in to continue</div></div></div>
        <div class="seg">
          <a class="seg-btn active" href="/login">Sign in</a>
          <a class="seg-btn" href="/signup">Create account</a>
        </div>
        <form id="auth-form" autocomplete="on">
          <label class="field"><span>Email</span><input id="a-email" type="email" autocomplete="email" required placeholder="you@hospital.org" /></label>
          <label class="field"><span>Password</span><input id="a-pass" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters" /></label>
          <div id="auth-msg" class="small" role="status" aria-live="polite"></div>
          <button class="btn btn-primary btn-lg" id="auth-go" type="submit" style="width:100%;justify-content:center">Sign in</button>
        </form>
        <p class="small muted" style="margin:14px 0 0;text-align:center">New here? <a href="/signup">Create an account</a></p>
      </div>
    </div>
  </section>
  <script type="module" src="/static/auth_page.js"></script>
</body>
</html>
